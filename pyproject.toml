[project]
name = "blog_writing_crew"
version = "0.1.0"
description = "blog-writing-crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "crewai[google-genai,openai,tools]==1.13.0",
    "fastapi>=0.141.1",
    "google-genai>=1.65.0",
    "python-dotenv>=1.1.1",
    "uvicorn[standard]>=0.44.0",
]

[project.scripts]
blog_writing_crew = "blog_writing_crew.main:run"
run_crew = "blog_writing_crew.main:run"
train = "blog_writing_crew.main:train"
replay = "blog_writing_crew.main:replay"
test = "blog_writing_crew.main:test"
run_with_trigger = "blog_writing_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "f66c1c87-b4ab-40db-97da-d96fbc02e9e1"
